name: new_energy_service
description: "New Energy electric vehicle service app."
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: ^3.13.4

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  html: ^0.15.7
  http: ^1.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/newenergy_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/app_icon.png
    background_color: "#2661E9"
    theme_color: "#2661E9"

flutter_native_splash:
  color: "#2661E9"
  image: assets/newenergy_logo.png
  fullscreen: true
  android_12:
    color: "#2661E9"
    image: assets/app_icon.png
